[package]
name = "block-mesh-bgm-examples"
version = "0.2.1"
edition = "2021"
# Bevy 0.20 requires Rust 1.97.1.
rust-version = "1.97.1"
publish = false

[dependencies]
bevy = "0.20"
bevy_voxel_world = "0.19"
block-mesh = "0.2"
block-mesh-bgm = { path = ".." }
ndshape = "0.3"
noise = "0.9"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "ao"
harness = false

[[example]]
name = "render"
path = "render/main.rs"

[[example]]
name = "custom_meshing"
path = "custom_meshing/main.rs"

[[example]]
name = "ambient_occlusion"
path = "ambient_occlusion/main.rs"
